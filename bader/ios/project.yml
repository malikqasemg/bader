name: Bader
options:
  bundleIdPrefix: com.malikqasem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: VXUUYYRN92
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bader:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bader
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [bluetooth-central, audio]
        NSMicrophoneUsageDescription: Bader listens when you press the talk button.
        NSCameraUsageDescription: Bader uses the camera to pair with your computer and to look at things you show it.
        NSBluetoothAlwaysUsageDescription: Bader connects to its small display over Bluetooth.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malikqasem.bader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
  BaderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Bader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malikqasem.bader.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Bader:
    build:
      targets:
        Bader: all
        BaderTests: [test]
    test:
      targets: [BaderTests]
