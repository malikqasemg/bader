<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bader</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; cursor: pointer; }
      #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
      #bubble {
        max-width: 150px; margin-bottom: 5px; padding: 5px 9px; border-radius: 12px;
        background: rgba(18, 22, 30, 0.94); color: #ebeef2; border: 1px solid rgba(64, 224, 255, 0.35);
        font: 500 11.5px/1.3 -apple-system, "SF Pro Rounded", "Segoe UI", "SF Arabic", Tahoma, sans-serif;
        text-align: center; opacity: 0; transform: translateY(8px) scale(0.9); transition: opacity 0.25s, transform 0.25s;
        display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
      }
      #bubble.on { opacity: 1; transform: none; }
      #who { height: 147px; transform-origin: 50% 100%; will-change: transform; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35)); }
      #who.head { height: 105px; }
      #who img { height: 100%; display: block; pointer-events: none; }

      .away { transform: translateY(125%); }
      .pop { animation: pop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      .bye { animation: bye 0.4s ease-in both; }
      .breathe { animation: breathe 3.2s ease-in-out infinite; }
      .wiggle { animation: wiggle 0.5s ease-in-out 3; }
      .jump { animation: jump 0.6s cubic-bezier(0.3, 0, 0.3, 1) 2; }
      .dance { animation: dance 0.42s ease-in-out infinite; }
      .shake { animation: shake 0.35s linear 3; }
      .nod { animation: nod 1.1s ease-in-out infinite; }
      .spin { animation: spin 0.8s ease-in-out 1; }
      .peek { animation: peek 2.6s ease-in-out 1; }
      @keyframes pop { from { transform: translateY(125%); } to { transform: none; } }
      @keyframes bye { from { transform: none; } to { transform: translateY(125%); } }
      @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 0.985); } }
      @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
      @keyframes jump { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: translateY(0) scale(1.08, 0.88); } 50% { transform: translateY(-32px) scale(0.96, 1.06); } 85% { transform: translateY(0) scale(1.06, 0.92); } }
      @keyframes dance { 0%, 100% { transform: rotate(-5deg) translateY(0); } 50% { transform: rotate(5deg) translateY(-10px); } }
      @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
      @keyframes nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
      @keyframes spin { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
      @keyframes peek { 0% { transform: translateY(125%); } 25%, 70% { transform: translateY(42%) rotate(-4deg); } 100% { transform: none; } }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bubble" dir="auto"></div>
      <div id="who" class="away"><img id="pic" alt="" /></div>
    </div>
    <script type="module" src="/src/buddy/main.ts"></script>
  </body>
</html>
